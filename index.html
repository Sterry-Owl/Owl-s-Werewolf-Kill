<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血月年代記 α2.1.0</title>
    <link rel="icon" href="favicon.ico?v=1.0" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        
        <!-- ============================================== -->
        <!-- 區塊一：登入/建立房間介面 (Entry) -->
        <!-- ============================================== -->
        <div id="section-entry" class="player-app-container entry-screen">
            <div class="entry-overlay">
                <img src="img/title.webp" alt="血月年代記" style="width: 85%; max-width: 320px; max-height: 110px; object-fit: contain; display: block; margin: 0 auto 10px; transform: scale(1.8);">
                
                <div class="entry-box">
                    <h3 class="entry-box-title" style="color: var(--accent-blue);">建立房間</h3>
                    <input type="text" id="input-host-room-id" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="輸入 4 位數房號（空白則隨機產生）">
                    <input type="text" id="input-host-name" placeholder="請輸入暱稱（您將成為 1 號玩家）">
                    <button id="btn-create-room" style="width: 100%; margin-top: 10px;">建立房間</button>
                </div>
                
                <div class="entry-box">
                    <h3 class="entry-box-title" style="color: var(--accent-green);">加入房間</h3>
                    <input type="text" id="input-room-id" placeholder="請輸入房間代碼">
                    <input type="text" id="input-player-name" placeholder="請輸入暱稱">
                    <button id="btn-join-room" class="btn-success" style="width: 100%; margin-top: 10px;">加入房間</button>
                </div>
            </div>
        </div>
        
        <!-- ============================================== -->
        <!-- 區塊三：玩家端介面 (Player UI) -->
        <!-- ============================================== -->
        <div id="section-player" class="hidden">
            <div class="player-app-container">

                <div class="app-header">
                    <div class="header-left">
                        <span id="player-seat-number" class="seat-num"></span><span class="seat-unit">號</span>
                    </div>
            
                    <div class="header-center" style="display:flex; flex-direction:column; align-items:center; line-height: 1.2;">
                        <div id="dynamic-board-name"></div>
                        <button id="btn-host-settings" class="hidden">房間設定 ⚙️</button>
                        <button id="btn-board-details" class="hidden">版型詳情 ℹ️</button>
                    </div>
                    
                    <div class="header-right">
                        <span class="role-text">身分：<span id="player-role-name">等待發牌</span></span>
                    </div>
                </div>
                
                <div class="app-body">
                    <div id="left-seats" class="seat-column"></div>
                    
                    <div class="center-column">
                        <div id="dynamic-action-panel" class="action-panel">
                            <div id="target-slots-container" class="target-slots-container hidden"></div>
                            
                            <div id="action-prompt" class="action-prompt"></div>
                            <div id="dynamic-buttons-container" class="action-buttons-row"></div>
                        </div>
                    </div>
                    
                    <div id="right-seats" class="seat-column"></div>
                    
                    <div class="card-panel">
                        <!-- 3D 翻轉容器 -->
                        <div id="my-card-container" class="card-container hidden" style="cursor: pointer;">
                            <div id="my-card-flipper" class="card-flipper">
                                <!-- 正面：卡面圖 -->
                                <div class="card-front">
                                    <img id="my-card-img" class="my-card" src="">
                                </div>
                                <!-- 背面：技能說明 -->
                                <div class="card-back my-card">
                                    <div class="role-desc-title" id="role-desc-title"></div>
                                    <div class="role-desc-content" id="role-desc-content"></div>
                                </div>
                            </div>
                        </div>
                        <div id="vote-history-panel" class="vote-history-panel hidden"></div>
                    </div>
                </div>
                
                <button id="btn-self-explode" class="floating-btn red hidden"></button>
                <button id="btn-wolf-chat" class="floating-btn purple hidden" style="background-image: url('./img/btn-chat.webp');"></button>
                <button id="btn-day-skill" class="floating-btn hidden" style="left: 15px;"></button>
                <button id="btn-bailout" class="floating-btn blue hidden"></button> 
                <!-- 黃色票型紀錄按鈕依然安全存在 -->
                <button id="btn-vote-history" class="floating-btn yellow hidden"></button>
                <button id="btn-end-speech" class="floating-btn skip hidden"></button>
                
                <div id="local-day-skill-panel" class="action-panel hidden" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.9);">
                    <div id="local-day-skill-prompt" class="action-prompt">請選擇目標：</div>
                    <div id="local-day-skill-targets" class="action-buttons-row" style="margin-top: 15px; margin-bottom: 15px; max-height: 200px; overflow-y: auto;"></div>
                    <button id="btn-cancel-day-skill" class="btn-secondary" style="width: 100%;">取消</button>
                </div>
                
                <div id="board-details-panel" class="board-details-panel" style="display: none;">
                    <div style="padding:20px; text-align:center; font-size:14px; color:#ccc;">等待房主選擇版型...</div>
                </div>

                <div id="wolf-chat-modal" class="modal hidden" style="display: none; position: absolute; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 400px; border-radius: 8px; padding: 15px; box-sizing: border-box;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0; color: #fff;">狼人夜間溝通</h3>
                        <span id="close-wolf-chat-btn" style="color: #aaa; font-size: 24px; cursor: pointer;">&times;</span>
                    </div>
                    <div id="wolf-chat-logs" style="height: 200px; overflow-y: auto; background: #111; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-family: monospace;"></div>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="wolf-chat-input" placeholder="午夜階段可發送訊息..." style="flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;" />
                        <button id="btn-wolf-chat-send" class="btn-primary" style="padding: 8px 15px;">發送</button>
                    </div>
                    <div id="wolf-chat-lock-notice" style="color: #ff4d4d; font-size: 12px; margin-top: 5px; display: none;">⚠️ 目前非午夜階段，僅供讀取歷史紀錄。</div>
                </div>

                <!-- [新增] 房主專用全知視角紀錄 Modal -->
                <div id="host-control-modal" class="hidden">
                    <div style="background:var(--accent-red); color:#fff; font-size:13px; font-weight:bold; text-align:center; padding:6px; position:relative; flex-shrink:0;">
                        【房主】控制區域 (房號：<span id="display-room-id" style="color: #ffdb4d;"></span>)
                        <span id="close-host-modal-btn" style="position:absolute; right:15px; top:3px; font-size:18px; cursor:pointer;">&times;</span>
                    </div>
                    <div style="flex:1; overflow-y:auto; padding:15px; position:relative;">
                        
                        <div id="host-header-flex" style="display:flex; justify-content:center; align-items:center; gap:8px; border-bottom:1px solid #444; padding-bottom:4px; margin-bottom:4px;">
                             <div id="host-status-log" style="font-size:12px; color:var(--accent-red); font-weight:bold;"></div>
                             <div id="host-setup-title" style="color:var(--accent-blue); font-size:12px; font-weight:bold; border-left:1px solid #444; padding-left:8px;">選擇版型</div>
                        </div>

                        <!-- 遊戲前：設定面板 -->
                        <div id="host-setup-content">
                            <div class="toggle-group" id="template-category-tabs" style="margin-bottom:4px; background:transparent; padding:6px 0;">
                                <div class="toggle-option active" data-category="standard" style="--active-bg: #333; --active-color: var(--wolf-yellow);">標準</div>
                                <div class="toggle-option" data-category="quick" style="--active-bg: #333; --active-color: var(--wolf-yellow);">快速</div>
                                <div class="toggle-option" data-category="fun" style="--active-bg: #333; --active-color: var(--wolf-yellow);">娛樂</div>
                                <div class="toggle-option" data-category="test" style="--active-bg: #333; --active-color: var(--wolf-yellow);">測試</div>
                            </div>
                            
                            <!-- 版型網格與分頁按鈕 -->
                            <div id="board-template-container" class="board-grid"></div>
                            
                            <div id="board-role-preview" style="text-align:center; font-size:10px; margin-bottom:2px; padding:0 5px; line-height:1.4; word-wrap:break-word;"></div>
                            <div id="board-pagination-controls" style="display:flex; visibility:hidden; height:18px; justify-content:center; gap:12px; margin-bottom:12px; align-items:center;">
                                <button id="btn-prev-page" class="btn-secondary" style="padding:0 12px; font-size:12px; line-height:16px;">◂</button>
                                <span id="board-page-indicator" style="font-size:10px; color:#aaa; font-weight:bold;">1 / 1</span>
                                <button id="btn-next-page" class="btn-secondary" style="padding:0 12px; font-size:12px; line-height:16px;">▸</button>
                            </div>
                            <input type="hidden" id="select-board-template" value="">

                            <div style="color:var(--accent-blue); font-size:12px; font-weight:bold; margin-top:12px; margin-bottom:10px; border-bottom:1px solid #444; padding-bottom:4px; text-align:center;">遊戲規則</div>
                            <div class="rules-grid">
                                <div class="rule-item">
                                    <label>首夜襲擊</label>
                                    <div class="toggle-group" data-target="rule-first-night-kill">
                                        <div class="toggle-option active" data-value="enabled" style="--active-bg: #6b8496; --active-color: #fff;">預設</div>
                                        <div class="toggle-option" data-value="disabled" style="--active-bg: #9e646a; --active-color: #fff;">無刀</div>
                                    </div><input type="hidden" id="rule-first-night-kill" value="enabled">
                                </div>
                                <div class="rule-item" style="grid-column: span 2;">
                                    <label>發言時長</label>
                                    <div class="toggle-group" data-target="rule-speech-time">
                                        <div class="toggle-option" data-value="90" style="--active-bg: #6b8496; --active-color: #fff;">90s</div>
                                        <div class="toggle-option active" data-value="120" style="--active-bg: #6b8496; --active-color: #fff;">120s</div>
                                        <div class="toggle-option" data-value="150" style="--active-bg: #9e646a; --active-color: #fff;">150s</div>
                                    </div><input type="hidden" id="rule-speech-time" value="120">
                                </div>
                                <div class="rule-item">
                                    <label>女巫自救</label>
                                    <div class="toggle-group" data-target="rule-witch-save">
                                        <div class="toggle-option active" data-value="never" style="--active-bg: #6b8496; --active-color: #fff;">不可</div>
                                        <div class="toggle-option" data-value="first_night" style="--active-bg: #9e646a; --active-color: #fff;">首夜</div>
                                    </div><input type="hidden" id="rule-witch-save" value="never">
                                </div>
                                <div class="rule-item">
                                    <label>勝利條件</label>
                                    <div class="toggle-group" data-target="rule-win-condition">
                                        <div class="toggle-option active" data-value="kill_side" style="--active-bg: #6b8496; --active-color: #fff;">屠邊</div>
                                        <div class="toggle-option" data-value="kill_all" style="--active-bg: #9e646a; --active-color: #fff;">屠城</div>
                                    </div><input type="hidden" id="rule-win-condition" value="kill_side">
                                </div>
                                <div class="rule-item">
                                    <label>警長機制</label>
                                    <div class="toggle-group" data-target="rule-sheriff">
                                        <div class="toggle-option active" data-value="enabled" style="--active-bg: #6b8496; --active-color: #fff;">開啟</div>
                                        <div class="toggle-option" data-value="disabled" style="--active-bg: #9e646a; --active-color: #fff;">關閉</div>
                                    </div><input type="hidden" id="rule-sheriff" value="enabled">
                                </div>
                                <div class="rule-item">
                                    <label>自爆吞警徽</label>
                                    <div class="toggle-group" data-target="rule-sheriff-explode">
                                        <div class="toggle-option active" data-value="double" style="--active-bg: #6b8496; --active-color: #fff;">雙爆</div>
                                        <div class="toggle-option" data-value="single" style="--active-bg: #9e646a; --active-color: #fff;">單爆</div>
                                    </div><input type="hidden" id="rule-sheriff-explode" value="double">
                                </div>
                                <div class="rule-item">
                                    <label>身分揭曉</label>
                                    <div class="toggle-group" data-target="rule-death-reveal">
                                        <div class="toggle-option active" data-value="dark" style="--active-bg: #6b8496; --active-color: #fff;">暗牌</div>
                                        <div class="toggle-option" data-value="light" style="--active-bg: #9e646a; --active-color: #fff;">明牌</div>
                                    </div><input type="hidden" id="rule-death-reveal" value="dark">
                                </div>
                                <div class="rule-item">
                                    <label>卡面樣式</label>
                                    <div class="toggle-group" data-target="rule-square-card">
                                        <div class="toggle-option active" data-value="off" style="--active-bg: #6b8496; --active-color: #fff;">經典</div>
                                        <div class="toggle-option" data-value="on" style="--active-bg: #9e646a; --active-color: #fff;">舊日</div>
                                    </div><input type="hidden" id="rule-square-card" value="off">
                                </div>
                            </div>
                            <button id="btn-start-game" class="btn-success" style="width:100%; margin-top:10px;">確認並發牌</button>
                        </div>
                        <div id="host-action-content" class="hidden" style="display:flex; flex-direction:column; gap:12px;">
                            <button id="btn-local-host-action" class="btn-primary" style="padding:15px; font-size:14px;"></button>
                            <button id="btn-local-force-next" class="btn-secondary" style="padding:15px; font-size:14px;">強制跳過階段</button>
                            <hr style="border:0; border-top:1px dashed #555; width:100%; margin: 5px 0;" />
                            <button id="btn-toggle-master-log" class="btn-secondary" style="padding:10px;">展開、折疊．後台紀錄</button>
                            <div id="host-master-log-content" class="hidden" style="background:#111; padding:10px; border-radius:6px; font-size:11px; color:#ddd; max-height:250px; overflow-y:auto; line-height:1.5;"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div> <!-- 關閉 section-player -->
    </div> <!-- 關閉 container -->
    
    <script src="js/config.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/role.js"></script>
    <script src="js/phases.js"></script>
    <script src="js/host.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
